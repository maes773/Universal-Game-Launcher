[workspace]
resolver = "2"
members = ["crates/ugl-core", "crates/ugl-app"]

[workspace.package]
version = "0.0.4"
edition = "2021"

[workspace.dependencies]
# SQLite empaquetado: el usuario final no necesita instalar nada.
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
dirs = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
