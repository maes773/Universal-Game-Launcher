[package]
name = "ugl-app"
version.workspace = true
edition.workspace = true
description = "UGL (Universal Game Launcher): aplicación de escritorio"
build = "build.rs"

[[bin]]
name = "ugl"
path = "src/main.rs"

[dependencies]
ugl-core = { path = "../ugl-core" }
# Interfaz gráfica.
slint = "1.8"
# Selectores nativos de archivos y carpetas.
rfd = "0.15"

# Icono y menú de la bandeja del sistema de Windows.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"

[build-dependencies]
slint-build = "1.8"

# Incrusta el icono en ugl.exe (solo al compilar en Windows).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
